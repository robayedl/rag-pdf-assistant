[project]
name = "documind"
version = "1.6.0"
description = "DocuMind — Agentic Document Intelligence powered by LangGraph, Gemini 2.5 Flash, and hybrid search"
authors = [
    {name = "Robayed Ashraf"}
]
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
exclude = [".venv", "__pycache__", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]
